name: Daily Centris Scraper

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install playwright-extra puppeteer-extra-plugin-stealth playwright

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps
    - name: Run Scraper Script
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.CENTRIS_INGEST_SECRET }}
          MAX_PAGES: "10"
        run: node scraper.js
